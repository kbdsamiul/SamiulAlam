name: Rebuild Site from Admin Data

# Runs automatically whenever data.json is changed in the repo
on:
  push:
    paths:
      - 'data.json'   # Only triggers when you upload a new data.json

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Allows the action to commit the rebuilt index.html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild index.html from data.json
        run: python3 build.py

      - name: Commit and push updated index.html
        run: |
          git config user.name "Site Builder Bot"
          git config user.email "bot@samiul-site"
          git add index.html
          git diff --staged --quiet || git commit -m "🔄 Auto-rebuild site from admin data [$(date '+%Y-%m-%d %H:%M')]"
          git push
